apiVersion: v1
kind: Secret
metadata:
  name: rapid-secrets
  namespace: production
type: Opaque
data:
  SECRET_KEY: eW91ci1zZWNyZXQta2V5
  DB_PASSWORD: eW91ci1kYi1wYXNzd29yZA==
stringData:
  DB_NAME: ""
  DB_USER: ""
  DB_HOST: ""
  DB_PORT: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rapid-env
  namespace: production
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  DB_NAME: ""
  DB_USER: ""
  DB_PASSWORD: ""
  DB_HOST: ""
  DB_PORT: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapid-competitions
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rapid-competitions
  template:
    metadata:
      labels:
        app: rapid-competitions
    spec:
      containers:
      - name: rapid-competitions
        image: mominur2804/rapid-competitions:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: rapid-env
        - secretRef:
            name: rapid-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rapid-competitions-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: rapid-competitions
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
