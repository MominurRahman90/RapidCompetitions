
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapid-competitions
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rapid-competitions
  template:
    metadata:
      labels:
        app: rapid-competitions
    spec:
      containers:
      - name: rapid-container
        image: mominur2804/rapid-competitions:latest
        ports:
        - containerPort: 8000
        env:
          value: "False"


---
apiVersion: v1
kind: Service
metadata:
  name: rapid-competitions-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: rapid-competitions
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
